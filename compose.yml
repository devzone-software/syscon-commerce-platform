x-service-env: &service-env
  DB_USER: syscon
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  SERVICE_TOKEN: ${SERVICE_TOKEN}

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks: [backend]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syscon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U syscon -d auth']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]
  auth:
    <<: *service-defaults
    build: {context: ., args: {SERVICE: auth-service}}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/auth
      AUTH_ADMIN_EMAIL: ${ADMIN_EMAIL}
      AUTH_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  catalog:
    <<: *service-defaults
    build: {context: ., args: {SERVICE: catalog-service}}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/catalog
  supplier:
    <<: *service-defaults
    build: {context: ., args: {SERVICE: supplier-service}}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/supplier
      SUPPLIER_ALLOWED_HOSTS: ${SUPPLIER_ALLOWED_HOSTS:-}
      CLIENTS_CATALOG_URL: http://catalog:8082
    depends_on:
      postgres: {condition: service_healthy}
      catalog: {condition: service_started}
  orders:
    <<: *service-defaults
    build: {context: ., args: {SERVICE: order-service}}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/orders
      CLIENTS_CATALOG_URL: http://catalog:8082
    depends_on:
      postgres: {condition: service_healthy}
      catalog: {condition: service_started}
  payment:
    <<: *service-defaults
    build: {context: ., args: {SERVICE: payment-service}}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/payment
      CLIENTS_ORDERS_URL: http://orders:8084
    depends_on:
      postgres: {condition: service_healthy}
      orders: {condition: service_started}
  invoice:
    <<: *service-defaults
    build: {context: ., args: {SERVICE: invoice-service}}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/invoice
      CLIENTS_ORDERS_URL: http://orders:8084
      SUNAT_RUC: ${SUNAT_RUC:-}
      SUNAT_SOL_USER: ${SUNAT_SOL_USER:-}
      SUNAT_SOL_PASSWORD: ${SUNAT_SOL_PASSWORD:-}
      SUNAT_CERTIFICATE_PATH: ${SUNAT_CERTIFICATE_PATH:-}
      SUNAT_CERTIFICATE_PASSWORD: ${SUNAT_CERTIFICATE_PASSWORD:-}
      SUNAT_ENDPOINT: ${SUNAT_ENDPOINT:-https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
    volumes:
      - ./certificates:/run/secrets/sunat:ro
    depends_on:
      postgres: {condition: service_healthy}
      orders: {condition: service_started}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['80:80']
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [auth, catalog, supplier, orders, payment, invoice]
    networks: [backend]

volumes:
  pgdata:
networks:
  backend:
    internal: false
